version: 1
name: Booli
slug: booli
# BROWSER-BRIDGE MCP: it reaches its site through the user's signed-in tab
# via the fetchproxy bridge, so a registration also needs runtime fly-shared,
# bridge: true and a bridgePortEnv — registration fields this manifest has no
# schema for. state.dataDir below is required for bridge and is why it is
# declared.
summary: >-
  Search Booli.se, Sweden's property portal: homes for sale, sold prices
  (slutpriser) with over/under-asking %, area lookup, and market stats like
  median price per m².
env:
  - name: BOOLI_TRANSPORT
    required: false
    help: >-
      Selects the transport used to reach the site (e.g. the fetchproxy bridge
      vs a direct fetch). Leave unset for the default.
  - name: BOOLI_WS_PORT
    required: false
    help: >-
      Concentrator port for the fetchproxy browser bridge (defaults to the
      fleet-shared 37149). The runner injects a per-registration port for a
      hosted bridged child, so this is the name to give bridgePortEnv at
      registration.
state:
  dataDir: true
  reason: >-
    The fetchproxy identity lives at $HOME/.fetchproxy/identity/<name>.json
    and the pair code derives from it. Without a persistent $HOME every cold
    start mints a fresh identity and re-prompts pairing in the browser; the
    API refuses bridge without it.
egress:
  allow:
    # Only hosts the SERVER process actually fetches. BOOLI_TRANSPORT=direct
    # (and the first attempt under the default auto) POSTs straight to
    # https://www.booli.se/graphql from the process (src/transport-direct.ts);
    # no redirect hop — the Cloudflare challenge answers on www itself. The
    # fetchproxy mode dials nothing: the user's tab does the fetch. The apex
    # booli.se is never dialled (it appears only in URLs this server builds
    # and returns, src/format.ts), so it is not listed.
    - www.booli.se
examples:
  # Sample prompts for the public catalog. Each maps onto real read-only
  # tools: booli_search_areas -> booli_search_listings / booli_search_sold /
  # booli_market_stats, and booli_get_listing for one property.
  - prompt: >-
      Find apartments for sale in Södermalm, Stockholm with at least 2 rooms
      under 5 million SEK.
    note: Resolves the area, then searches active for-sale listings.
  - prompt: >-
      What have 3-room apartments in Vasastan sold for since January, and how
      far over asking did they go?
    note: Uses sold prices (slutpriser) with over/under-asking %.
  - prompt: >-
      Give me the median sold price and price per m² for villas in Lund
      municipality.
    note: Aggregates one page of recent sold results for the area.
